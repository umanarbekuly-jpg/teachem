name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tutor, POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: tutor_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tutor -d tutor_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://tutor:test-only-password@localhost:5432/tutor_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters
      PUBLIC_ORIGIN: http://localhost:8080
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: teststorage
      S3_SECRET_KEY: test-storage-password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm api:generate && git diff --exit-code -- apps/api/openapi.json apps/web/lib/api-client/schema.ts
      - run: pnpm build
        env:
          NODE_ENV: production
