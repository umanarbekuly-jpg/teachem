name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tutor, POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: tutor_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tutor -d tutor_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://tutor:test-only-password@localhost:5432/tutor_test
      TEACHEM_TEST_DATABASE_URL: postgresql://tutor:test-only-password@localhost:5432/tutor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.1', cache-dependency-path: apps/api-go/go.sum }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: go -C apps/api-go run ./cmd/server migrate
      - run: go -C apps/api-go vet ./...
      - run: pnpm test:e2e
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm api:generate && git diff --exit-code -- apps/web/lib/api-client/schema.ts
      - run: pnpm build
